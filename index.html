($,{children:`intake → research → plan → plan review → build → verify → PR`}),`. Thinking phases run read-only on the host against the task's own clone; building runs inside an isolated sandbox with its own database snapshot and no platform secret — the sandbox is the boundary, and an allow-listed egress proxy is the only way out. Resource limits keep the host healthy.`]}),(0,T.jsxs)(`p`,{children:[`No surprises during build: every question is asked once, in research; the plan is reviewed by a second session with the code-review rubrics and then `,(0,T.jsx)($,{children:`approved by the owner`}),` (a consent the model cannot set). The build is a step loop, one commit per plan step, with a self-review before verify. A missing decision stops the loop and asks instead of guessing.`]}),(0,T.jsx)(`p`,{children:`Commits are authored by the engineer who drives the task, co-authored by the bot. The first push needs consent; later checkpoints push automatically, so an engineer can pull the branch into their local coding assistant at any point, push, and the sandbox merges before its next step. Idle sandboxes park, warn, and archive with the work committed and pushed — automatic cleanup, nothing lost.`}),(0,T.jsxs)(`p`,{children:[`Every sandbox also runs `,(0,T.jsx)($,{children:`px0`}),`, a lightweight web IDE by Arpit Bhiyani. I came across it while building this and wired its AI features to our sandboxed agent, so engineers can open the task in the browser and code alongside the agent, one engine and one budget either way.`]}),(0,T.jsx)(`p`,{children:`Large tasks keep a living design doc in Confluence, refreshed from the task files. Verification evidence (tests, builds, Playwright) lands in the PR body; the PR stays a draft until the owner marks it ready, and the review pack picks it up from there.`})]}),(0,T.jsxs)(zm,{title:`Bug triage & draft fix PRs`,tag:`Jira · Sentry`,summary:`From a Jira ticket or a Sentry alert: prove it's a bug, investigate, open a draft PR behind consent.`,children:[(0,T.jsx)(`p`,{children:`The pack forces a verdict before any code: is this actually a bug? Not-a-bug or low-confidence stops at an explanation.`}),(0,T.jsxs)(`p`,{children:[(0,T.jsx)(Bm,{children:`/sentryfix`}),` does the same from a production alert: in the alert's own Slack thread (or from an issue URL or id) it reads the Sentry event through a fenced, read-only proxy with personal data redacted — and returns `,(0,T.jsx)($,{children:`bug`}),`, `,(0,T.jsx)($,{children:`expected`}),`, `,(0,T.jsx)($,{children:`insufficient`}),` or `,(0,T.jsx)($,{children:`environmental`}),`. Only a confident bug offers the draft PR. No Jira call on any Sentry path; the two flows share one fix pipeline and one prompt.`]}),(0,T.jsxs)(`p`,{children:[`A fix PR is only ever a `,(0,T.jsx)($,{children:`draft`}),`, and only after a human says yes. Consent lives in a database column the model can't set — a prompt injection that skips the ask still can't push. The engine holds no push credential; it commits to a throwaway worktree and asks the platform to open the PR. Credentials stay on the platform side and never appear in model-visible text.`]}),(0,T.jsxs)(`p`,{children:[`Guardrails: protected branches, `,(0,T.jsx)($,{children:`platform gate checks on every write`}),`, the consent flag, and a re-affirm that the ticket is still a bug. Any one blocks the push alone.`]}),(0,T.jsx)(`p`,{children:`Say "move BUG-1042 to Ready for QA" and it resolves the ticket's currently-valid transitions, picks the closest match, and moves it. It never moves a ticket on its own; a Jira failure never blocks the fix.`})]}),(0,T.jsxs)(zm,{title:`Docs map — Confluence, checked against code`,summary:`~1,100 pages triaged; a page becomes citable only after it survives an audit.`,children:[(0,T.jsx)(`p`,{children:`Docs drift as code moves; that is normal in any fast-moving codebase. So no page is cited on trust: each one earns its place by surviving an audit against the code.`}),(0,T.jsx)(`p`,{children:`Triage removes noise first: title-pattern rules catch obvious junk, then a small, fast model sorts the rest in batches. Excluded pages get no map entry — only an id→title line so they can't creep back in. A classifier error keeps the batch in the audit queue: it fails toward checking, never toward silent exclusion.`}),(0,T.jsxs)(`p`,{children:[`Each audit is a read-only session that traces the page's claims through real call chains and records a verdict with code anchors. Unaudited pages don't exist to the engine. The daily `,(0,T.jsx)($,{children:`drift watch`}),` flips changed pages to needs-recheck; deleted pages are flagged. Ops manage it from an admin panel — verdicts, filters, one-click revalidate or exclude.`]})]}),(0,T.jsxs)(zm,{title:`Cross-repo PR review & staging deploys`,tag:`multi-PR`,summary:`Related PRs across repos reviewed together, against a review skill built on our own coding standards — and a one-command staging environment.`,children:[(0,T.jsxs)(`p`,{children:[`Hand it one PR or several across repos. It checks `,(0,T.jsx)($,{children:`build integrity`}),` (every new symbol, prop and import resolves), `,(0,T.jsx)($,{children:`reachability`}),` (the changed code is actually hit in the product) and runs a `,(0,T.jsx)($,{children:`cross-pass`}),` so backend and frontends agree on shapes and values. The rubric is our own coding standards, kept as an org review skill. It reviews; it doesn't merge and doesn't push.`]}),(0,T.jsxs)(`p`,{children:[`A `,(0,T.jsx)(Bm,{children:`/stage`}),` command brings a branch or the whole stack up on staging. Targets are config, so adding a repo takes no code.`]}),(0,T.jsxs)(`p`,{children:[`Every bugfix or review is recorded as a `,(0,T.jsx)($,{children:`Case`}),` — ticket, verdict, PR links, staging URLs, outcome — through one lifecycle: `,(0,T.jsx)(Bm,{children:`investigating → verdict → pr_open → staged → resolved`}),`.`]})]}),(0,T.jsxs)(zm,{title:`Engineering ledger — what keeps breaking, and whether the fixes
